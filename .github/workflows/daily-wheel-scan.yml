name: Daily Wheel Scan & Rebalance

on:
  schedule:
    # 14:30 UTC ≈ 9:30 AM EST / 10:30 AM EDT. Winter starts at the open; summer
    # starts one hour after. GH delay buffer remains; pipeline also waits if
    # before_open and rechecks cutoff before equity/CC submits.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      force_full_rebalance:
        description: 'Force a full equity rebuild (legacy Beat SPY flag; unused for wheel-10k)'
        type: boolean
        default: false

# Serialize with afternoon manage so both never trade the same paper book at once.
concurrency:
  group: aletheia-wheel-paper
  cancel-in-progress: false

jobs:
  market-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Decide whether to run today
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — bypassing holiday gate."
            exit 0
          fi
          python3 scripts/should_run_daily_scan.py --github-output

  daily-scan:
    needs: market-gate
    if: needs.market-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Restore performance data (learning files)
        uses: actions/cache/restore@v4
        id: perf_cache_restore
        with:
          path: |
            data/performance
            data/cache
          key: perf-${{ github.repository }}-wheel-v1-${{ github.run_id }}
          restore-keys: |
            perf-${{ github.repository }}-wheel-v1-
            perf-${{ github.repository }}-wheel-v1

      - name: Restore scan run cache
        uses: actions/cache/restore@v4
        id: scan_cache_restore
        with:
          path: data/scan_cache
          key: scan-${{ github.repository }}-wheel-v1-${{ github.run_id }}
          restore-keys: |
            scan-${{ github.repository }}-wheel-v1-
            scan-${{ github.repository }}-wheel-v1

      - name: Cache restore diagnostics
        run: |
          mkdir -p data/performance data/scan_cache
          echo "performance cache hit: ${{ steps.perf_cache_restore.outputs.cache-hit }}"
          echo "scan cache hit: ${{ steps.scan_cache_restore.outputs.cache-hit }}"
          echo "S3 scan cache bucket: ${SCAN_CACHE_S3_BUCKET:-not set}"
          echo "S3 scan cache prefix: ${SCAN_CACHE_S3_PREFIX:-not set}"
          echo "market gate reason: ${{ needs.market-gate.outputs.reason }}"
          echo "performance files:" && ls -la data/performance/ 2>/dev/null || true
          echo "weekly_ledger lines:" && wc -l data/performance/weekly_ledger.jsonl 2>/dev/null || echo 0
          echo "scan_cache run dirs:" && ls data/scan_cache/ 2>/dev/null | wc -l
        env:
          SCAN_CACHE_S3_BUCKET: ${{ secrets.SCAN_CACHE_S3_BUCKET }}
          SCAN_CACHE_S3_PREFIX: ${{ secrets.SCAN_CACHE_S3_PREFIX }}

      # After cache restore: late schedule must not full-rebalance if morning already did.
      # workflow_dispatch always proceeds (manual override).
      - name: Same-day skip check (schedule only)
        id: once
        if: github.event_name == 'schedule'
        run: poetry run python scripts/should_run_daily_scan.py --check-already-ran --github-output

      - name: Preflight checks
        if: github.event_name != 'schedule' || steps.once.outputs.already_ran != 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: poetry run python preflight.py --skip-biotech --deepseek-timeout 30 --soft-fail-deepseek

      - name: Run daily wheel scan & rebalance
        id: scan
        if: github.event_name != 'schedule' || steps.once.outputs.already_ran != 'true'
        env:
          SCAN_CACHE_KEEP_WEEKS: "26"
          CACHE_HIT_PERFORMANCE: ${{ steps.perf_cache_restore.outputs.cache-hit }}
          CACHE_HIT_SCAN: ${{ steps.scan_cache_restore.outputs.cache-hit }}
          SCAN_CACHE_S3_BUCKET: ${{ secrets.SCAN_CACHE_S3_BUCKET }}
          SCAN_CACHE_S3_PREFIX: ${{ secrets.SCAN_CACHE_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          CC_OTM_PCT_LOW: '0.03'
          CC_OTM_PCT_HIGH: '0.08'
          CC_TARGET_OTM_PCT: '0.05'
        run: |
          poetry run python weekly_scan_rebalancing.py \
            --run-profile wheel-10k \
            --agent-tier-mode core \
            --max-stocks 400 \
            --stop-loss-pct 0.08 \
            --execute \
            --enable-covered-calls \
            --enable-cash-secured-puts \
            --max-position-pct 0.35 --max-sector-pct 0.40 \
            --min-buy-confidence 55 --min-sell-confidence 55 \
            --cash-buffer-pct 0.06 --max-buy-tickers 8 \
            --max-csp-tickers 3 --max-csp-collateral-pct 0.45 \
            --min-csp-premium-usd 25 --min-csp-annualized-yield-pct 8 \
            --regime-mode auto \
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_full_rebalance == 'true' && '--force-full-rebalance' || '' }}

      - name: Skipped — already ran today (ET)
        if: github.event_name == 'schedule' && steps.once.outputs.already_ran == 'true'
        run: |
          echo "Skipping full wheel rebalance: ${{ steps.once.outputs.reason }}"
          echo "Manual workflow_dispatch still forces a re-run."

      - name: MISSED RUN email if scan failed
        if: failure() && steps.scan.outcome == 'failure'
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: poetry run python scripts/check_wheel_missed_run.py --force-missed

      - name: Post-run ops orchestrator
        if: always() && (github.event_name != 'schedule' || steps.once.outputs.already_ran != 'true')
        continue-on-error: true
        run: poetry run python scripts/ops_orchestrator.py --stage cockpit,slo,gonogo --strict

      - name: Upload daily run summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-wheel-run-summary-${{ github.run_id }}
          retention-days: 7
          path: |
            data/performance/
            data/scan_cache/**/meta.json
            data/scan_cache/**/decisions.json
            data/scan_cache/**/execution_results.json
            data/performance/operator_cockpit_latest.json
            data/performance/ops_orchestrator_latest.json
          if-no-files-found: ignore

      - name: Save performance data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/performance
            data/cache
          key: perf-${{ github.repository }}-wheel-v1-${{ github.run_id }}

      - name: Save scan run cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/scan_cache
          key: scan-${{ github.repository }}-wheel-v1-${{ github.run_id }}
