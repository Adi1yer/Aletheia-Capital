name: Wheel Options Daily Manage

# Multi-slot staggered crons resilient to GitHub Actions free-tier schedule delays.
# GH Actions free tier routinely delays 5–14 hours; multi-slot + idempotency ensures
# at least one in-window run on market days without double-trading.
#
# Strategy:
# - Multiple cron slots staggered ~90–120 minutes apart (Mon–Fri)
# - Idempotent already-ran gate: later slots skip if earlier slot succeeded same ET day
# - Hard abort when schedule fires outside usable window (past options cutoff 15:55 ET)
# - workflow_dispatch bypasses all gates (manual override)
#
# Trading window: 09:30–15:55 ET (options). Slots target coverage from
# late morning through mid-session so even multi-hour delay lands in-window.
on:
  schedule:
    # Slot 1: 14:00 UTC (mid-morning: 09:00/10:00 ET) — covers if delay < 6h
    - cron: '0 14 * * 1-5'
    # Slot 2: 16:00 UTC (late morning: 11:00/12:00 ET) — covers if delay < 8h
    - cron: '0 16 * * 1-5'
    # Slot 3: 18:00 UTC (early afternoon: 13:00/14:00 ET) — covers if delay < 10h
    - cron: '0 18 * * 1-5'
    # Slot 4: 20:00 UTC (mid-afternoon: 15:00/16:00 ET) — last chance before cutoff
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

# Wait if morning scan is still running (same paper book).
concurrency:
  group: aletheia-wheel-paper
  cancel-in-progress: false

jobs:
  market-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
      in_window: ${{ steps.window.outputs.in_window }}
      window_reason: ${{ steps.window.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
      - id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/should_run_daily_scan.py --github-output

      - name: Check market window (schedule only)
        id: window
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/check_market_window.py --workflow options --github-output || true
          # Exit 0 so later slots can still try; actual gate is in manage job condition

  manage:
    needs: market-gate
    if: |
      needs.market-gate.outputs.should_run == 'true' &&
      (github.event_name != 'schedule' || needs.market-gate.outputs.in_window == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          pip install poetry
          poetry config virtualenvs.in-project true
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-
      - run: poetry install --no-interaction --no-ansi

      - name: Restore performance / wheel state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/performance
            data/cache
          key: perf-${{ github.repository }}-wheel-v1-${{ github.run_id }}
          restore-keys: |
            perf-${{ github.repository }}-wheel-v1-
            perf-${{ github.repository }}-wheel-v1

      - name: Same-day skip check (schedule only)
        id: once
        if: github.event_name == 'schedule'
        run: poetry run python scripts/should_run_daily_scan.py --check-already-ran --track options --github-output

      - name: Manage wheel options
        id: manage
        if: github.event_name != 'schedule' || steps.once.outputs.already_ran != 'true'
        env:
          LOG_LEVEL: INFO
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MAX_UNDERLYING_PRICE: '35'
          CC_MIN_PREMIUM_USD: '15'
          CC_OTM_PCT_LOW: '0.03'
          CC_OTM_PCT_HIGH: '0.08'
          CC_TARGET_OTM_PCT: '0.05'
          MANAGE_DTE_THRESHOLD: '7'
          EMAIL_ON_CHANGES_ONLY: '1'
          # Options can still trade after equity DAY cutoff (15:30); early-close still wins.
          EXECUTE_CUTOFF_ET: '15:55'
        run: poetry run python scripts/manage_wheel_options.py

      - name: Skipped — already ran today (ET)
        if: github.event_name == 'schedule' && steps.once.outputs.already_ran == 'true'
        run: |
          echo "Skipping options manage: ${{ steps.once.outputs.reason }}"
          echo "Manual workflow_dispatch still forces a re-run."

      - name: Mark successful completion (schedule only, after trading)
        if: |
          always() &&
          github.event_name == 'schedule' &&
          steps.once.outputs.already_ran != 'true' &&
          steps.manage.outcome == 'success'
        run: poetry run python scripts/should_run_daily_scan.py --mark-ran-today --track options

      - name: Save performance / wheel state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/performance
            data/cache
          key: perf-${{ github.repository }}-wheel-v1-${{ github.run_id }}
