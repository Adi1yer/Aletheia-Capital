name: Wheel Options Daily Manage

# Mid-session options lifecycle for wheel-hybrid: BTC / roll near-ITM / short-DTE,
# then write covered calls on existing 100-share lots. No equity rebalance.
# Emails only when portfolio actions occur.
on:
  schedule:
    # 16:00 UTC ≈ 11:00 AM EST / 12:00 PM EDT — before NYSE early closes (13:00 ET)
    # and still inside RTH with GH queue buffer.
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

# Wait if morning scan is still running (same paper book).
concurrency:
  group: aletheia-wheel-paper
  cancel-in-progress: false

jobs:
  market-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
      - id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/should_run_daily_scan.py --github-output

  manage:
    needs: market-gate
    if: needs.market-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          pip install poetry
          poetry config virtualenvs.in-project true
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-
      - run: poetry install --no-interaction --no-ansi

      - name: Restore performance / wheel state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/performance
            data/cache
          key: perf-${{ github.repository }}-wheel-v1-${{ github.run_id }}
          restore-keys: |
            perf-${{ github.repository }}-wheel-v1-
            perf-${{ github.repository }}-wheel-v1

      - name: Manage wheel options
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MAX_UNDERLYING_PRICE: '35'
          CC_MIN_PREMIUM_USD: '15'
          CC_OTM_PCT_LOW: '0.03'
          CC_OTM_PCT_HIGH: '0.08'
          CC_TARGET_OTM_PCT: '0.05'
          MANAGE_DTE_THRESHOLD: '7'
          EMAIL_ON_CHANGES_ONLY: '1'
          # Options can still trade after equity DAY cutoff (15:30); early-close still wins.
          EXECUTE_CUTOFF_ET: '15:55'
        run: poetry run python scripts/manage_wheel_options.py

      - name: Save performance / wheel state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/performance
            data/cache
          key: perf-${{ github.repository }}-wheel-v1-${{ github.run_id }}
