name: Growth-Income-Drip Daily Snapshot

# Multi-slot staggered crons resilient to GitHub Actions free-tier schedule delays.
# GH Actions free tier routinely delays 5–14 hours; multi-slot + idempotency ensures
# at least one in-window run on market days without double-trading.
#
# Strategy:
# - Multiple cron slots staggered ~90–120 minutes apart (Mon–Fri)
# - Idempotent already-ran gate: later slots skip if earlier slot succeeded same ET day
# - Hard abort when schedule fires outside usable window (past equity close 16:00 ET)
# - workflow_dispatch bypasses all gates (manual override)
#
# Trading window: 09:30–16:00 ET (residual cash deploy before close). Slots target
# coverage from morning through mid-session so even multi-hour delay lands in-window.
on:
  schedule:
    # Slot 1: 12:00 UTC (early morning: 07:00/08:00 ET) — covers if delay < 5h
    - cron: '0 12 * * 1-5'
    # Slot 2: 14:00 UTC (mid-morning: 09:00/10:00 ET) — covers if delay < 7h
    - cron: '0 14 * * 1-5'
    # Slot 3: 16:00 UTC (late morning: 11:00/12:00 ET) — covers if delay < 9h
    - cron: '0 16 * * 1-5'
    # Slot 4: 18:00 UTC (early afternoon: 13:00/14:00 ET) — covers if delay < 11h
    - cron: '0 18 * * 1-5'
    # Slot 5: 20:00 UTC (mid-afternoon: 15:00/16:00 ET) — last chance before close
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

# Separate concurrency group from wheel track
concurrency:
  group: aletheia-drip-paper
  cancel-in-progress: false

jobs:
  market-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
      in_window: ${{ steps.window.outputs.in_window }}
      window_reason: ${{ steps.window.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Decide whether to run today (holiday gate)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — bypassing holiday gate."
            exit 0
          fi
          python3 scripts/should_run_daily_scan.py --github-output

      - name: Check market window (schedule only)
        id: window
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/check_market_window.py --workflow drip --github-output || true
          # Exit 0 so later slots can still try; actual gate is in daily-snapshot job condition

  daily-snapshot:
    needs: market-gate
    if: |
      needs.market-gate.outputs.should_run == 'true' &&
      (github.event_name != 'schedule' || needs.market-gate.outputs.in_window == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Restore drip performance data
        uses: actions/cache/restore@v4
        id: drip_cache_restore
        with:
          path: data/performance/growth_income_drip_v1
          key: drip-perf-${{ github.repository }}-v1-${{ github.run_id }}
          restore-keys: |
            drip-perf-${{ github.repository }}-v1-
            drip-perf-${{ github.repository }}-v1

      - name: Cache restore diagnostics
        run: |
          mkdir -p data/performance/growth_income_drip_v1
          echo "drip performance cache hit: ${{ steps.drip_cache_restore.outputs.cache-hit }}"
          echo "performance files:" && ls -la data/performance/growth_income_drip_v1/ 2>/dev/null || true

      - name: Same-day skip check (schedule only)
        id: once
        if: github.event_name == 'schedule'
        run: poetry run python scripts/should_run_daily_scan.py --check-already-ran --track drip --github-output

      - name: Run daily snapshot (with residual cash deployment)
        id: drip
        if: github.event_name != 'schedule' || steps.once.outputs.already_ran != 'true'
        env:
          LOG_LEVEL: INFO
          DRIP_ALPACA_API_KEY: ${{ secrets.DRIP_ALPACA_API_KEY }}
          DRIP_ALPACA_SECRET_KEY: ${{ secrets.DRIP_ALPACA_SECRET_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          poetry run python scripts/growth_income_drip_rebalance.py --execute

      - name: Skipped — already ran today (ET)
        if: github.event_name == 'schedule' && steps.once.outputs.already_ran == 'true'
        run: |
          echo "Skipping drip daily snapshot: ${{ steps.once.outputs.reason }}"
          echo "Manual workflow_dispatch still forces a re-run."

      - name: Mark successful completion (schedule only, after trading)
        if: |
          always() &&
          github.event_name == 'schedule' &&
          steps.once.outputs.already_ran != 'true' &&
          steps.drip.outcome == 'success'
        run: poetry run python scripts/should_run_daily_scan.py --mark-ran-today --track drip

      - name: Upload daily snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drip-daily-snapshot-${{ github.run_id }}
          retention-days: 7
          path: |
            data/performance/growth_income_drip_v1/
          if-no-files-found: ignore

      - name: Save drip performance data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/performance/growth_income_drip_v1
          key: drip-perf-${{ github.repository }}-v1-${{ github.run_id }}
