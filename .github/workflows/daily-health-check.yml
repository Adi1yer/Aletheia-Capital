name: Daily Position Health Check

on:
  schedule:
    # 16:00 UTC = ~9:00 AM Pacific during PDT
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Run ONLY read-only fills/positions report (skips normal health check)'
        required: false
        type: boolean
        default: false
      report_date:
        description: 'Date for fills report (YYYY-MM-DD), leave empty for today ET'
        required: false
        type: string

jobs:
  read-only-report:
    # READ-ONLY report job: runs ONLY when report_only is true
    # Makes zero order/cancel/replace calls - GET-only operations
    if: github.event.inputs.report_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Generate read-only fills and positions report
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            poetry run python scripts/read_only_fills_report.py --date "$REPORT_DATE"
          else
            poetry run python scripts/read_only_fills_report.py
          fi

      - name: Verify read-only operation
        run: |
          # Verify script and broker contain NO order submission calls
          set -e
          
          echo "Checking script for order submission calls..."
          if grep -E '\.(submit_order|submit_option_order|execute_order|cancel_order|replace_order)\(' scripts/read_only_fills_report.py; then
            echo "ERROR: Script contains order submission calls!" >&2
            exit 1
          fi
          
          echo "Checking broker read path for order submission calls..."
          # Only check the methods called by the script (read path)
          if grep -A 30 'def get_account\|def get_positions\|def get_option_positions\|def get_recent_orders' src/broker/alpaca.py | \
             grep -E 'submit_order|cancel_order|replace_order'; then
            echo "ERROR: Broker read methods contain order submission calls!" >&2
            exit 1
          fi
          
          echo "✓ Read-only verified: no order/cancel/replace calls found"

  health:
    # Normal health check job: runs on schedule or when report_only is false/absent
    if: github.event.inputs.report_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Restore daily snapshots
        uses: actions/cache/restore@v4
        id: snapshots_restore
        with:
          path: data/daily_snapshots
          key: daily-snapshots-${{ github.repository }}-main
          restore-keys: |
            daily-snapshots-${{ github.repository }}-

      - name: Restore biotech thesis ledger
        uses: actions/cache/restore@v4
        id: biotech_ledger_restore
        with:
          path: data/biotech
          key: biotech-data-${{ github.repository }}-main
          restore-keys: |
            biotech-data-${{ github.repository }}-

      - name: Restore fund metrics data
        uses: actions/cache/restore@v4
        with:
          path: data/fund
          key: fund-data-${{ github.repository }}-main
          restore-keys: fund-data-${{ github.repository }}-

      - name: Daily snapshots (all configured workflows)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BIOTECH_ALPACA_API_KEY: ${{ secrets.BIOTECH_ALPACA_API_KEY }}
          BIOTECH_ALPACA_SECRET_KEY: ${{ secrets.BIOTECH_ALPACA_SECRET_KEY }}
          BIOTECH_ALPACA_API_SECRET_KEY: ${{ secrets.BIOTECH_ALPACA_SECRET_KEY }}
          MULTI_SLEEVE_ALPACA_API_KEY: ${{ secrets.MULTI_SLEEVE_ALPACA_API_KEY }}
          MULTI_SLEEVE_ALPACA_API_SECRET_KEY: ${{ secrets.MULTI_SLEEVE_ALPACA_API_SECRET_KEY }}
          HEDGE_ALPACA_API_KEY: ${{ secrets.HEDGE_ALPACA_API_KEY }}
          HEDGE_ALPACA_SECRET_KEY: ${{ secrets.HEDGE_ALPACA_SECRET_KEY }}
          HEDGE_ALPACA_API_SECRET_KEY: ${{ secrets.HEDGE_ALPACA_SECRET_KEY }}
          FOREX_IBKR_ACCOUNT_ID: ${{ secrets.FOREX_IBKR_ACCOUNT_ID }}
          FUTURES_IBKR_ACCOUNT_ID: ${{ secrets.FUTURES_IBKR_ACCOUNT_ID }}
          COMMODITIES_IBKR_ACCOUNT_ID: ${{ secrets.COMMODITIES_IBKR_ACCOUNT_ID }}
          IBKR_GATEWAY_HOST: ${{ secrets.IBKR_GATEWAY_HOST }}
          IBKR_GATEWAY_PORT: ${{ secrets.IBKR_GATEWAY_PORT }}
        run: |
          set -e
          poetry run python daily_health_check.py --account all --ci
          poetry run python -c "from src.fund.orchestrator import run_orchestrator; run_orchestrator()"

      - name: Save daily snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/daily_snapshots
          key: daily-snapshots-${{ github.repository }}-main

      - name: Save fund metrics
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/fund
          key: fund-data-${{ github.repository }}-main

      - name: Save biotech data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/biotech
          key: biotech-data-${{ github.repository }}-main
